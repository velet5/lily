# Lily Studio for macOS: `npm run dist` writes release/Lily Studio-<version>-<arch>.dmg
# (DECISIONS D37), signed with a Developer ID and notarized (D38).
# `npm run dist:local` builds it ad-hoc signed, for a Mac without the
# certificate. Everything the app runs is bundled into dist/ by esbuild.mjs,
# so no node_modules are packaged.
appId: io.github.velet5.lily-studio
productName: Lily Studio
directories:
  output: release
  buildResources: build
files:
  - package.json
  - dist/**/*
  - renderer/**/*
  - '!**/*.map'
# lilypond reads runtime/timing.ly, worker.scm and glyph-cache.scm itself,
# and cannot look inside the asar archive; main.ts points at the unpacked copy.
asarUnpack:
  - dist/runtime/**
mac:
  target:
    - target: dmg
  category: public.app-category.music
  # The Developer ID Application certificate in the login keychain. Apple
  # notarizes only a hardened runtime; the entitlements let V8 compile.
  identity: Oleg Arshinskii (KTSS95TY2K)
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Uploaded to Apple and stapled when APPLE_KEYCHAIN_PROFILE names a
  # `notarytool store-credentials` profile; `npm run dist` sets lily-notary.
  # scripts/notarize-dmg.mjs does the same for the DMG around it.
  notarize: true
dmg:
  # Signed, so the DMG itself can be notarized and stapled.
  sign: true
  title: ${productName}
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications
