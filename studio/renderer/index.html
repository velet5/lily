<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lily Studio</title>
    <!-- Monaco adds its own <style> elements, hence 'unsafe-inline' for styles
         only (DECISIONS D29); 'wasm-unsafe-eval' lets the grammar compile
         Oniguruma's WebAssembly, and nothing else (D30). -->
    <link rel="stylesheet" href="../dist/renderer/app.css" />
    <link rel="stylesheet" href="layout.css" />
    <script src="../dist/renderer/app.js" defer></script>
  </head>
  <body>
    <!-- The fixed layout of DECISIONS D28: files | editor | preview, a status
         line below. src/renderer/index.ts fills the panes. -->
    <main class="studio">
      <nav class="pane files" data-pane="files" aria-label="Files">
        <header class="pane-header">
          <span class="pane-title">Files</span>
          <span class="pane-actions"></span>
        </header>
        <div class="pane-body placeholder">No folder open</div>
      </nav>
      <section class="pane editor" data-pane="editor" aria-label="Editor">
        <header class="pane-header"><span class="pane-title">Editor</span></header>
        <div class="pane-body placeholder">No score open</div>
      </section>
      <section class="pane preview" data-pane="preview" aria-label="Preview">
        <header class="pane-header">
          <span class="pane-title">Preview</span>
          <span class="pane-actions"></span>
        </header>
        <div class="pane-body placeholder">The score appears here</div>
      </section>
      <footer class="status" data-pane="status" role="status"></footer>
    </main>
  </body>
</html>
