name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version the tests and data/completions.json were verified with (D23).
  LILYPOND_VERSION: 2.26.0

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache LilyPond
        id: lilypond
        uses: actions/cache@v4
        with:
          path: ~/lilypond
          key: lilypond-${{ env.LILYPOND_VERSION }}-linux-x86_64

      - name: Download LilyPond
        if: steps.lilypond.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/lilypond
          curl -fsSL "https://gitlab.com/lilypond/lilypond/-/releases/v$LILYPOND_VERSION/downloads/lilypond-$LILYPOND_VERSION-linux-x86_64.tar.gz" \
            | tar -xz -C ~/lilypond --strip-components=1

      # The compile tests skip themselves without lilypond (D15), so a broken
      # install would turn CI green while testing nothing. Fail here instead.
      - name: Check LilyPond
        run: |
          echo "$HOME/lilypond/bin" >> "$GITHUB_PATH"
          "$HOME/lilypond/bin/lilypond" --version

      - name: Types
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Grammar snapshots
        run: npm run test:grammar

      - name: Unit tests
        run: npm run test:unit

      # `npm test` repeats the four steps above as its pretest; they are listed
      # separately so that a failure names itself.
      - name: Extension-host tests
        run: xvfb-run -a npm test

      - name: Package, and run the sample score through the packaged extension
        run: xvfb-run -a npm run test:e2e

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
